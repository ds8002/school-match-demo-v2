<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>School Match Walkthrough v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one presenter stage. Sticky bar with the four steps in order, one big working pane, Back/Next at the bottom.
   Sized for a classroom projector: large type, few elements per screen. Same identity as the School Match Hub. */
:root{
  --bg:#f3f6f4; --panel:#ffffff; --panel2:#f8faf9; --ink:#15211b; --muted:#56665e; --line:#d6e0da;
  --pitch:#1d7349; --pitch-soft:#e2f0e8; --gold:#a87a08; --gold-soft:#f7ecd0;
  --blue:#2f66a3; --blue-soft:#e3edf8; --you:#b9541a; --you-soft:#f9e8dc; --loop:#7446a8; --loop-soft:#efe6f8;
  --bad:#b42318; --bad-soft:#fbe4e1;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --panel:#151d19; --panel2:#111814; --ink:#e4ede8; --muted:#9aaba2; --line:#2a3731;
  --pitch:#43b57c; --pitch-soft:#173226; --gold:#e2b440; --gold-soft:#3a2f12;
  --blue:#73a7e0; --blue-soft:#16263a; --you:#ec955b; --you-soft:#3a2213; --loop:#ad8ae0; --loop-soft:#2a1f3a;
  --bad:#f07a6c; --bad-soft:#3a1814; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --panel:#151d19; --panel2:#111814; --ink:#e4ede8; --muted:#9aaba2; --line:#2a3731;
  --pitch:#43b57c; --pitch-soft:#173226; --gold:#e2b440; --gold-soft:#3a2f12;
  --blue:#73a7e0; --blue-soft:#16263a; --you:#ec955b; --you-soft:#3a2213; --loop:#ad8ae0; --loop-soft:#2a1f3a;
  --bad:#f07a6c; --bad-soft:#3a1814; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
a{color:var(--pitch)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--pitch);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.2px;text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:32px;height:32px;flex:none}
.brand h1{font-size:24px;line-height:1}
.brand small{display:block;font-size:13px;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
ol.steps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:600;font-size:15px}
ol.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font:700 14px var(--f-mono)}
ol.steps button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
ol.steps button.on .n{background:#fff;color:var(--pitch)}
ol.steps button.done .n{background:var(--pitch-soft);color:var(--pitch)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--pitch)}
.btn.go{background:var(--pitch);border-color:var(--pitch);color:#fff}
.btn.big{font-size:22px;padding:16px 28px;border-radius:14px;font-family:var(--f-display)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn[hidden]{display:none}
.btn.ok{border-color:var(--pitch);color:var(--pitch)}
.btn.no{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.wrap>*{min-width:0}
.head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;justify-content:space-between}
.head h2{font-size:36px;line-height:1.05}
.eyebrow{font:600 13px var(--f-mono);letter-spacing:.8px;text-transform:uppercase;color:var(--pitch)}
.lede{color:var(--muted);max-width:70ch;margin:4px 0 0}
.who{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;min-width:200px}
.who .l{font:600 11px var(--f-mono);letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.who b{font-family:var(--f-display);font-size:18px;line-height:1.15}
.who .t{font-size:13px;color:var(--you);font-weight:600}
.who.auto .t{color:var(--blue)}
.problem{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;border-left:4px solid var(--bad);background:var(--panel);border-radius:0 12px 12px 0;padding:10px 16px}
.problem b{font:700 24px var(--f-display);color:var(--bad)}
.problem span{font-size:15px;color:var(--muted)}
.funnel{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.funnel .fs{flex:1 1 110px;display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:10px;background:var(--panel2)}
.funnel .fs .v{font:700 34px/1 var(--f-display)}
.funnel .fs .l{font-weight:700;font-size:15px}
.funnel .fs .t{font-size:12.5px;color:var(--muted)}
.funnel .fs.last{background:var(--gold-soft)}
.funnel .fs.last .v{color:var(--gold)}
.funnel .fa{align-self:center;color:var(--muted);font-size:20px}
.drvin{display:inline-flex;align-items:center;gap:4px;margin:2px 6px 2px 0}
.drvin input{width:84px;font:15px var(--f-mono);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.drvin .u{font-size:13px;color:var(--muted)}
.drvlab{font:600 11px var(--f-mono);color:var(--muted);margin-right:2px}
.drvt td{vertical-align:top}
tr.chg td{background:var(--gold-soft)}
dl.calc,dl.other{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:12px 0 0;font-size:15px}
dl.calc dt,dl.other dt{color:var(--muted)}
dl.calc dd,dl.other dd{margin:0}
dl.other dt{font-weight:600;color:var(--ink)}
ol.steps button.drv{border-style:dashed}
ol.steps button.drv.on{border-style:solid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font-size:21px;margin-bottom:8px}
.muted{color:var(--muted)} .small{font-size:14px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.g{background:var(--pitch-soft);color:var(--pitch);border-color:transparent}
.tag.b{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag.o{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.tag.r{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.y{background:var(--you-soft);color:var(--you);border-color:transparent}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
/* step 1 */
.launch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.chan{display:flex;flex-direction:column;gap:10px}
.ch{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.ch .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font:700 14px var(--f-mono);color:var(--muted)}
.ch b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.15}
.ch .d{font-size:14px;color:var(--muted)}
.ch .res{font:700 22px var(--f-display);color:var(--muted);text-align:right;white-space:nowrap}
.ch.run{border-color:var(--blue)} .ch.run .ic{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.ch.ok .ic{background:var(--pitch);border-color:var(--pitch);color:#fff}
.ch.ok .res{color:var(--pitch)}
@keyframes spin{to{transform:rotate(360deg)}}
.start{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.found{display:flex;flex-direction:column;gap:14px}
.sum{border-radius:14px;padding:16px 18px;background:var(--pitch-soft);border:1px solid transparent}
.sum p{margin:0;font-size:21px;line-height:1.35}
.sum strong{font-family:var(--f-display);font-size:26px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.split .card h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.split .card h3 .num{font-size:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--panel2);animation:pop .3s ease-out both}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
/* step 2 */
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.crit .card{display:flex;flex-direction:column;gap:6px}
.crit .k{font:700 13px var(--f-mono);color:var(--muted)}
.crit label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.crit input[type=range]{flex:1;accent-color:var(--pitch)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--panel2);white-space:nowrap}
tr.row{cursor:pointer} tr.row:hover td{background:var(--panel2)}
tr.cut td{border-bottom:3px solid var(--pitch)}
td.r,th.r{text-align:right}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:11px;height:11px;border-radius:3px;background:var(--line);display:block}
.dots i.on{background:var(--pitch)}
.tot{font:700 18px var(--f-display)}
.detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.detail>div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--panel2)}
.detail b{display:block;font-family:var(--f-display);font-size:16px;margin-bottom:2px}
/* step 3 */
.act{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.queue{display:flex;flex-direction:column;gap:4px;max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:6px}
.queue button{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer;font-size:15px}
.queue button:hover{background:var(--panel2)}
.queue button.on{background:var(--pitch-soft)}
.queue .rk{font:600 12px var(--f-mono);color:var(--muted)}
.queue .st{width:10px;height:10px;border-radius:50%;background:var(--line)}
.queue .st.a{background:var(--pitch)} .queue .st.s{background:var(--bad)}
.plan{display:flex;flex-direction:column;gap:14px}
.lvl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.lvl button{border:0;background:none;border-radius:9px;padding:8px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;color:var(--ink);font:inherit}
.lvl button:hover{background:var(--panel)}
.lvl button b{font:700 17px var(--f-display)}
.lvl button span{font-size:13.5px;color:var(--muted)}
.lvl button.on{background:var(--panel);box-shadow:inset 0 0 0 2px var(--pitch)}
.lvl button .rec{font:600 11px var(--f-mono);color:var(--pitch);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.tp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tp>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.tp h4{margin:0 0 4px;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.tp ul{margin:0;padding-left:18px;font-size:15px}.tp li{margin:2px 0}
.tp>div.warn{border-color:transparent;background:var(--gold-soft)}
.sched{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-size:14.5px;font-weight:600}
textarea[readonly]{background:var(--panel2)}
@media (max-width:700px){.lvl,.tp{grid-template-columns:1fr}}
.plan .nm{font:700 30px/1.05 var(--f-display)}
.q3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.q3>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.q3 .l{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.q3 p{margin:4px 0 0;font-size:15.5px}
ol.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:t}
ol.todo li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:15.5px;counter-increment:t}
ol.todo li::before{content:counter(t);width:24px;height:24px;border-radius:50%;background:var(--pitch-soft);color:var(--pitch);font:700 13px var(--f-mono);display:grid;place-items:center}
ol.todo .who{font-size:12.5px;white-space:nowrap}
textarea{width:100%;min-height:380px;font:15px/1.5 var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* v2: ladder */
.ladder{display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--gold)}
ol.rungs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr);gap:6px;align-items:stretch}
ol.rungs li{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
ol.rungs li:nth-child(7){background:var(--gold-soft);border-color:transparent}
ol.rungs li:nth-child(9){background:var(--blue-soft);border-color:transparent}
ol.rungs li:nth-child(9) .amt{color:var(--blue)}
ol.rungs li.ar{border:0;background:none;padding:0;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
ol.rungs .rn{font:700 12px var(--f-mono);color:var(--muted)}
ol.rungs b{font:700 19px/1.1 var(--f-display)}
ol.rungs .amt{font-size:14px;color:var(--pitch);font-weight:600}
ol.rungs .cnt{font-size:13px;font-weight:700;color:var(--you);margin-top:auto;padding-top:4px}
.qh{font:600 11px var(--f-mono);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.newstrip{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-left:4px solid var(--blue);background:var(--panel);border-radius:0 12px 12px 0;padding:10px 16px;font-size:15px}
.newstrip b{font:700 22px var(--f-display);color:var(--blue)}
@media (max-width:900px){ol.rungs{grid-template-columns:minmax(0,1fr)}ol.rungs li.ar{display:none}}
/* v3: value x warmth grid */
.vw{display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--blue)}
.vgrid{display:grid;grid-template-columns:26px minmax(0,1fr) 78px minmax(0,1fr);gap:8px}
.vgrid .ax{font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.4px;text-align:center}
.vgrid .ax.y{grid-column:1;grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg)}
.vgrid .ax.x{grid-column:2/5;grid-row:3}
.vc{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel2);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.vc:hover{border-color:var(--ink)}
.vc.hc{grid-column:2;grid-row:1;background:var(--blue-soft);border-color:transparent}
.vc.hw{grid-column:4;grid-row:1;background:var(--pitch-soft);border-color:transparent}
.vc.lc{grid-column:2;grid-row:2}
.vc.lw{grid-column:4;grid-row:2;background:var(--gold-soft);border-color:transparent}
.vc.on{outline:3px solid var(--ink);outline-offset:1px}
.vc .vt{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.vc b{font:700 22px/1.1 var(--f-display)}
.vc .vch{font-size:14.5px;line-height:1.35}
.vc .vn{font-size:14px;font-weight:700;margin-top:auto;padding-top:6px}
.vc .vsub{font-size:13px;color:var(--muted)}
.bridge{grid-column:3;grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 12px var(--f-mono);color:var(--blue);gap:2px}
.bridge .arr{font-size:22px;line-height:1}
@media (max-width:760px){.vgrid{grid-template-columns:minmax(0,1fr)}.vgrid>*{grid-column:1 !important;grid-row:auto !important}.vgrid .ax.y{writing-mode:horizontal-tb;transform:none}.bridge{flex-direction:row;gap:8px}}
/* step 4 */
.kan{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:220px}
.col h4{margin:0 0 2px;font:700 16px var(--f-display);display:flex;justify-content:space-between}
.col.win{background:var(--gold-soft);border-color:transparent}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13.5px;line-height:1.25;animation:pop .35s ease-out both;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.card2 .s{color:var(--muted);font-size:12px}
.col.win .card2{padding:6px 8px;flex-direction:column}
.months{display:flex;gap:4px;flex-wrap:wrap}
.months span{font:600 12px var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.months span.on{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.months span.rev{border-color:var(--gold);color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font:700 32px/1.1 var(--f-display)}
.kpi .t{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:15px}
.bar .tr{height:18px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar .tr i{display:block;height:100%;background:var(--pitch)}
.bar .tr i.lt{background:var(--blue)}
.bar .num{text-align:right}

<script>
(function(){
"use strict";
var D=window.HUB_DATA;D.firms=D.firms.concat(window.LOCAL_FIRMS||[]);
/* Plan numbers from the team deck (FYS SICP slides, slides 17-18) */
var PLAN0={school:30000, team:15000, child:1400, years:3,
  prospects:100, emails:50, intros:10, hiVal:5000, asks:[20,30,30], win:[0.15,0.10,0.10], cupFee:7500, cupShare:0.75, fam:40000, board:17000, boardOn:false};
var PLAN=JSON.parse(JSON.stringify(PLAN0));
var STEPS=[{id:"find",n:"Find prospects"},{id:"rank",n:"Rank by criteria"},{id:"act",n:"Next steps"},{id:"track",n:"Track results"}];

function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){n=Math.round(n||0);if(n>=1e6)return "$"+(n/1e6).toFixed(2)+"M";if(n>=1e4)return "$"+Math.round(n/1e3)+"K";if(n>=1e3)return "$"+(n/1e3).toFixed(1)+"K";return "$"+n}
function hav(a,b,c,d){var R=3958.8,r=function(x){return x*Math.PI/180};var dl=r(c-a),dn=r(d-b);var h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(h))}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967296}
function toast(m){var h=$("toastHost");h.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){h.innerHTML=""},2600)}
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var reduce=false;try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}

var FIRM={};D.firms.forEach(function(f){FIRM[f.id]=f});
var OPEN=D.schools.filter(function(s){return s.st==="open"});
var SPONSORED=D.schools.filter(function(s){return s.st==="sponsored"}).length;
var CH={upgrade:{n:"Gives already, no school yet",t:"existing"},renew:{n:"Sponsors a school now",t:"existing"},peer:{n:"Funds a peer nonprofit",t:"new"},local:{n:"Gives publicly in DC",t:"new"}};

/* ---------- state ---------- */
var KEY="schoolmatch-walk-v2", S;
function fresh(){return {step:"find",scanned:false,w:{C:1,A:1,R:1},sel:null,appr:{},text:{},own:{},lv:{},frame:0,ran:false}}
function save(){store.set(KEY,JSON.stringify(S))}
function load(){try{var o=JSON.parse(store.get(KEY)||"null");return o&&o.w&&o.appr?o:null}catch(e){return null}}

/* ---------- logic ---------- */
function playOf(f){
  if(f.pipe==="renew")return "renew";
  if(f.ch.indexOf("Cup")>=0||f.ch.indexOf("Gala")>=0)return f.A<=1?"align":"upgrade";
  return "intro";
}
var PLAYN={upgrade:"Upgrade to a school",renew:"Renew + add a school",intro:"Ask for an introduction",align:"Build around their goals"};
function offer(f){return f.C>=3?{n:"Whole school",amt:PLAN.school}:f.C===2?{n:"Team share",amt:PLAN.team}:{n:"Fund a poet-athlete",amt:PLAN.child}}
function score(f){return S.w.C*f.C+S.w.A*f.A+S.w.R*f.R}
function maxScore(){return 3*(S.w.C+S.w.A+S.w.R)||1}
var RANK=[], MATCH={};
function rank(){
  RANK=D.firms.slice().sort(function(a,b){return score(b)-score(a)||b.R-a.R||b.C-a.C||a.n.localeCompare(b.n)});
  /* v3: value x warmth decides the channel and the staff time.
     high value, warm: tier 1 = the top PLAN.asks[0], asked in person this year; tier 4 = next year
     high value, cold: tier 6 = foundations, through their grant cycle; tier 2 = the top PLAN.intros, intro through an advocate; tier 3 = find a way in (invites meanwhile)
     lower value, warm: tier 5 = easy first step (Cup team, volunteer day, fund poet-athletes)
     lower value, cold: tier 7 = email, newsletter, event invites */
  var n1=0,n2=0;
  RANK.forEach(function(f){var c=cellOf(f);
    if(c==="hw"){f._tier=n1<PLAN.asks[0]?1:4;n1++}
    else if(c==="lw")f._tier=5;
    else if(c==="lc")f._tier=7;
    else if(isFdn(f))f._tier=6;
    else{f._tier=n2<PLAN.intros?2:3;n2++}});
  var pers=RANK.filter(function(f){return f._tier===1});
  /* nearest open school. Each school goes to one prospect while schools last; after that a prospect is offered
     the nearest school even if someone else was offered it too (whoever signs first gets it) */
  MATCH={};var used={};
  RANK.filter(function(f){return f._tier===1}).concat(RANK.filter(function(f){return f._tier===2})).forEach(function(f){
    if(f.lat==null){MATCH[f.id]={s:null};return}
    var free=OPEN.filter(function(s){return !used[s.n]}),pool=free.length?free:OPEN;
    var best=null,bd=1e9;pool.forEach(function(s){var d=hav(f.lat,f.lon,s.lat,s.lon);if(d<bd){bd=d;best=s}});
    if(best){used[best.n]=1;MATCH[f.id]={s:best,d:bd,shared:!free.length}}
  });
  return pers;
}
function personal(){return RANK.filter(function(f){return f._tier===1})}
function schoolText(f){var m=MATCH[f.id];if(!m||!m.s)return "a school in the ward they care about most";return m.s.n.replace(" School","")+(m.d<15?" ("+m.d.toFixed(1)+" mi from their office)":"")}
function shortSchool(f){var m=MATCH[f.id];return m&&m.s?m.s.n.replace(" Elementary School"," ES").replace(" Middle School"," MS").replace(" Education Campus"," EC").replace(" School",""):"Funder picks ward"}
function role(f){return f.role&&f.role.indexOf("UNKNOWN")<0?f.role.split(";")[0]:"community-impact lead"}
/* stored pitches predate the $30K deal size and sometimes name a school the matcher may give to someone else */
function why(f){var p=(f.pitch||"").replace(/\$35K/g,"$30K");return p&&!/(Elementary|Middle|ES\b|MS\b|Campus|school is|Ward \d)/.test(p)?p:(f.ea||p)}

/* ---------- v3: value x warmth. Staff time goes where a yes is worth most ---------- */
function isNew(f){return CH[f.pipe].t==="new"}
/* chance of a yes once someone they trust asks, by Alignment 0-3. Our assumption, replaced by real results after the pilot */
var FIT=[0.05,0.10,0.15,0.20];
function ev(f){return FIT[f.A]*offer(f).amt*PLAN.years}
function hiVal(f){return ev(f)>=PLAN.hiVal}
function warm(f){return !isNew(f)}
function cellOf(f){return (hiVal(f)?"h":"l")+(warm(f)?"w":"c")}
var CELLN={hw:"High value, warm",hc:"High value, cold",lw:"Lower value, warm",lc:"Lower value, cold"};
function isFdn(f){return /Foundation|Fdn/i.test(f.n)||/family|foundation/i.test(f.form||"")}
/* treatment for each tier, with staff hours per prospect for the year. Tier 1 follows the engine spec (10 §4.1): ~12 cultivation hours each plus ~28 per close, about 16 on average */
var TR={
  1:{n:"Ask in person",c:"g",h:16},
  4:{n:"Ask next year",c:"o",h:1},
  5:{n:"Easy first step",c:"y",h:1},
  2:{n:"Intro through an advocate",c:"b",h:3},
  6:{n:"Grant cycle",c:"b",h:6},
  3:{n:"Find a way in",c:"",h:0.5},
  7:{n:"Email + newsletter",c:"",h:0.1}};
/* industries, so a cold company can be matched to a peer that already supports DC SCORES */
var IND={
  law:{n:"law firm",ids:["f3","f5","f6","f8","f16","f17","f18","f19","f20","f37","f72","f73","f74","f81"]},
  con:{n:"consulting or accounting firm",ids:["f1","f10","f14","f21","f26","f27","f31","f32","f33","f34","f44","f67","f68"]},
  bld:{n:"builder or real estate firm",ids:["f22","f23","f24","f25","f29","f40","f45","f78"]},
  fin:{n:"bank or finance company",ids:["f4","f11","f12","f28","f38","f42","f43","f57","f58","f69","f70","f75"]},
  aer:{n:"aerospace or defense company",ids:["f13","f36","f61","f62","f63","f64","f65"]},
  tec:{n:"tech company",ids:["f30","f41","f66","f77","f82"]},
  hot:{n:"hotel company",ids:["f2","f60"]}};
var INDOF={};Object.keys(IND).forEach(function(k){IND[k].ids.forEach(function(id){INDOF[id]=k})});
/* the supporter in the same industry most likely to open a door: a school sponsor first, then the strongest relationship */
function advocate(f){
  var k=INDOF[f.id];if(!k||!isNew(f))return null;
  return D.firms.filter(function(x){return INDOF[x.id]===k&&!isNew(x)}).sort(function(a,b){return (b.pipe==="renew")-(a.pipe==="renew")||b.R-a.R||b.C-a.C})[0]||null;
}
function advRole(a){return a.pipe==="renew"?"a current school sponsor":"a SCORES Cup team"}
function dOpen(f){if(f.lat==null)return null;var m=1e9,s=null;OPEN.forEach(function(o){var d=hav(f.lat,f.lon,o.lat,o.lon);if(d<m){m=d;s=o}});return s?{s:s,d:m}:null}
function hasMV(f){return /match|volunteer/i.test([f.ec,f.focus,f.budget,f.er].join(" "))}
/* warmth signals: [text, 1 = DC SCORES already knows someone there] */
function signals(f){
  var a=[],c=f.ch||[];
  if(f.pipe==="renew")a.push(["Sponsors a school now",1]);
  if(c.indexOf("Cup")>=0)a.push(["Plays in the SCORES Cup",1]);
  if(c.some(function(x){return x!=="Cup"&&x!=="School"}))a.push(["Gave another gift in FY26",1]);
  var ad=advocate(f);if(ad)a.push(["Peer of "+ad.n+" ("+advRole(ad)+")",0]);
  var n=dOpen(f);if(n&&n.d<=2)a.push(["Office "+n.d.toFixed(1)+" mi from a school that needs a partner",0]);
  if(hasMV(f))a.push(["Employee matching or volunteer program",0]);
  return a;
}
function sigLine(f){var s=signals(f);return s.length?s.map(function(x){return x[0]}).join(" · "):"No connection found yet"}
var CELLDO={
  hw:{b:"High touch",t:"An intro from a board member, sponsor or Cup captain, a visit to a game or poetry slam, then a personal proposal"},
  hc:{b:"Build a way in",t:"A board member or a supporter in the same industry makes the intro, or apply through their foundation's grant cycle (the tool tracks the deadlines)"},
  lw:{b:"Easy first step",t:"Keep the Cup team, add a volunteer day, or fund poet-athletes"},
  lc:{b:"Email",t:"A short email, the newsletter and event invites. This is where email belongs"}};
function grid(){
  var C={hw:[],hc:[],lw:[],lc:[]};RANK.forEach(function(f){C[cellOf(f)].push(f)});
  var hrs=function(l){return l.reduce(function(s,f){return s+TR[f._tier].h},0)},tot=hrs(RANK)||1;
  var by=function(l){var m={};l.forEach(function(f){m[f._tier]=(m[f._tier]||0)+1});return Object.keys(m).sort(function(a,b){return [1,4,2,6,3,5,7].indexOf(+a)-[1,4,2,6,3,5,7].indexOf(+b)}).map(function(t){return m[t]+" "+TR[t].n.toLowerCase()}).join(" · ")};
  var box=function(k){var l=C[k];return '<button type="button" data-cell="'+k+'" class="vc '+k+(S.cell===k?' on':'')+'" aria-pressed="'+(S.cell===k)+'"><span class="vt">'+CELLN[k]+'</span><b>'+CELLDO[k].b+'</b><span class="vch">'+esc(CELLDO[k].t)+'</span><span class="vn"><span class="num">'+l.length+'</span> prospects'+(k==="lc"&&queued()?' (+'+queued()+' still being researched)':'')+' &middot; <span class="num">'+Math.round(hrs(l))+'</span> staff hour'+(Math.round(hrs(l))===1?"":"s")+'</span><span class="vsub">'+esc(by(l))+'</span></button>'};
  return '<div class="vw card"><div class="row2" style="justify-content:space-between;align-items:baseline"><h3 style="margin:0">Value &times; warmth: who gets staff time</h3><span class="small muted">About <span class="num">'+Math.round(tot)+'</span> staff hours this year (about <span class="num">'+Math.round(tot/48)+'</span> a week across the team). <span class="num">'+Math.round(100*hrs(C.hw)/tot)+'%</span> go to the high-value, warm box. Click a box to filter the list.</span></div>'+
    '<div class="vgrid"><span class="ax y">Value &uarr; &middot; chance &times; gift &times; 3 yrs</span>'+box("hc")+'<span class="bridge" aria-hidden="true"><span class="arr">&larr;</span>Advocates<span class="arr">&rarr;</span></span>'+box("hw")+box("lc")+box("lw")+'<span class="ax x">Cold &larr; Warmth &rarr; Warm &middot; does DC SCORES already know someone there?</span></div>'+
    '<p class="small" style="margin:0"><b>Advocates are the bridge.</b> Each board member gets the 2&ndash;4 companies they can open a door to and is asked for one intro a quarter. Sponsors and Cup captains do the same for peers in their industry. An intro moves a company into the warm column. Email never carries a '+money(PLAN.school)+' ask.</p>'+doors()+'</div>';
}
/* referral value: which supporters can open the most doors to high-value, cold companies */
function doors(){
  var m={};RANK.forEach(function(f){if(cellOf(f)!=="hc"||isFdn(f))return;var a=advocate(f);if(a){m[a.id]=m[a.id]||{a:a,n:0};m[a.id].n++}});
  var top=Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return y.n-x.n}).slice(0,4);
  return top.length?'<p class="small muted" style="margin:0"><b>Best door-openers (referral value):</b> '+top.map(function(x){return esc(x.a.n)+" &rarr; "+x.n+" "+(x.n>1?IND[INDOF[x.a.id]].n.replace(/company$/,"companies").replace(/firm$/,"firms"):IND[INDOF[x.a.id]].n)}).join(" &middot; ")+'</p>':"";
}
/* ---------- v2: who carries each ask, and what the tool prepares for them ---------- */
function introList(){return RANK.filter(function(f){return f._tier===2})}
/* materials the tool prepares. Nothing is sent by the tool: a person makes every call and sends every note. */
var MAT={
  points:{n:"Talking points",s:"For the call or the visit"},
  note:{n:"Short note",s:"To someone who knows us"},
  one:{n:"One-pager",s:"To forward inside the company"}};
function matOf(f){return (S.lv&&MAT[S.lv[f.id]]&&S.lv[f.id])||"points"}

var ABOUT="DC SCORES has run after-school programs in DC public schools since 1994. Our poet-athletes play on a soccer team, write and perform their own poetry, and lead a service-learning project in their neighborhood.";
var ABOUT_SHORT="As you've seen, our poet-athletes play soccer, write and perform poetry, and lead service projects in their own DC neighborhoods.";
function known(v){return v&&!/UNKNOWN/.test(v)?v:""}
function near(f){var m=MATCH[f.id];return m&&m.s&&m.d<8?m.s.n.replace(" School","")+" is "+m.d.toFixed(1)+" miles from your office":""}
function gaveVia(f){var c=f.ch||[];return c.indexOf("Cup")>=0&&c.indexOf("Gala")>=0?"fielding a SCORES Cup team and supporting our gala":c.indexOf("Cup")>=0?"fielding a SCORES Cup team":c.indexOf("Gala")>=0?"supporting our gala":"your support this year"}
function isCup(f){return (f.ch||[]).indexOf("Cup")>=0}
function pitchOK(f){var p=why(f);return p&&p===(f.pitch||"").replace(/\$35K/g,"$30K")?p:""}
function fitLine(f){
  var p=playOf(f),nr=near(f);
  if(p==="renew")return "Your partnership with "+(f.sp||"your school")+" is the model we want to grow, and "+(MATCH[f.id]&&MATCH[f.id].s?MATCH[f.id].s.n.replace(" School",""):"another school near you")+" still needs a partner.";
  if(p==="upgrade")return "Your people already know what DC SCORES does on the field, and a school of your own is the natural next step."+(nr?" "+nr+".":"");
  if(p==="align")return "We'd like to build something around what matters most to "+f.n+": employee engagement, local visibility, or ties with the neighborhoods where you work.";
  var pc=pitchOK(f);if(pc)return "We think "+f.n+" is a natural fit: "+(/^(Three|A|An|Fund|Add|Sponsor|Your|You)\b/.test(pc)?pc.charAt(0).toLowerCase()+pc.slice(1):pc)+(nr&&!/\bmiles?\b/.test(pc)?" "+nr+".":"");
  var base=f.pipe==="local"?f.n+" already gives back here in DC":f.n+" already funds youth programs in DC much like ours";
  return base+(nr?", and "+nr+".":".");
}
function moneyLine(f){
  var o=offer(f),k=kidsFor(o.amt),m0=MATCH[f.id],sch=m0&&m0.s?m0.s.n.replace(" School",""):"a school in the ward you care about most";
  if(o.amt>=PLAN.school)return money(o.amt)+" a year covers about "+k+" poet-athletes at "+sch+": coach stipends, buses to games (DC has no school buses), uniforms and equipment, and the poetry and service-learning work.";
  if(o.amt>=PLAN.team)return money(o.amt)+" a year covers about "+k+" poet-athletes, roughly one team, at "+sch+": coaching, buses to games, uniforms and the poetry work.";
  return money(o.amt)+" covers one poet-athlete for a full year: coaching, transportation, equipment, and the poetry and service-learning work.";
}
function kidsFor(amt){return Math.max(1,Math.floor(amt/(PLAN.child||1400)))}
function perks(){return "Your team would get game days to coach, an invitation to the end-of-season poetry slam, and a season report each fall and spring."}

/* the next rung up the ladder for this company */
function rung(f){
  if(isNew(f))return {n:"Come to a game",amt:0,t:"No money asked this year. Come watch a game at "+shortSchool(f)+", or come to the SCORES Cup as our guest."};
  var o=offer(f);return {n:o.n,amt:o.amt,t:o.n+" at "+schoolText(f)+", "+money(o.amt)+" a year for 3 years ("+money(o.amt*PLAN.years)+" in all)."};
}
/* who carries the ask */
function messenger(f){
  var p=playOf(f);
  if(p==="renew")return "Executive Director and Development Director, with the contact they already work with";
  if(isNew(f)){if(f._tier===6)return "The Development Director, through the foundation's normal grant application";var ad=advocate(f);return ad?"An advocate: "+ad.n+" is "+advRole(ad)+" and also a "+IND[INDOF[f.id]].n+". The Development Director asks their contact if they know anyone at "+f.n+". A board member is the backup":"A board member who knows someone at "+f.n+" (the tool checks the board list in Salesforce). If nobody does: an invite only, no ask"}
  if(isCup(f))return "Their SCORES Cup team captain, who brings in their "+role(f)+". The Development Director makes the first call to the captain";
  return "The Development Director, with the person they already know there";
}
function moment(f){
  var p=playOf(f),sch=shortSchool(f);
  if(p==="renew")return "Renewal meeting before the spring season, with their season report";
  if(isNew(f))return "A spring game at "+sch+", the end-of-season poetry slam, or the SCORES Cup (June 12) as guests";
  return "A spring game at "+sch+" (their giving lead comes to watch), then Signing Day at the SCORES Cup, June 12";
}

/* short note: always to someone who already knows DC SCORES */
function noteFor(f){
  var p=playOf(f),o=offer(f),sch=schoolText(f),sig="\n\n[Development Director]\nDC SCORES";
  var ad=isNew(f)?advocate(f):null;
  if(ad)return "Subject: Do you know anyone at "+f.n+"?\n\nHi [First name],\n\nThank you for "+(ad.pipe==="renew"?"sponsoring "+(ad.sp||"your DC SCORES school"):"fielding "+ad.n+"'s SCORES Cup team")+". Our research list flagged "+f.n+", another "+IND[INDOF[f.id]].n+" here in DC. Why they fit: "+((known(f.ea)?known(f.ea).replace(/\.?\s*$/,"."):"")||f.n+" already funds youth programs in DC much like ours.")+"\n\nWe don't want to cold-email them. If you know anyone there, would you send a two-line intro, or bring them along to a spring game at "+shortSchool(f)+"? No ask this year. We just want them to see the kids play.\n\nA one-page summary is attached in case it helps."+sig;
  if(isNew(f))return "Subject: Do you know anyone at "+f.n+"?\n\nHi [Board member's first name],\n\nOur research list flagged "+f.n+". Why they fit: "+((known(f.ea)?known(f.ea).replace(/\.?\s*$/,"."):"")||(f.pipe==="local"?f.n+" already gives back here in DC.":f.n+" already funds youth programs in DC much like ours."))+(MATCH[f.id]&&MATCH[f.id].s&&MATCH[f.id].d<15?" Their office is "+MATCH[f.id].d.toFixed(1)+" miles from "+shortSchool(f)+", which still needs a partner.":"")+"\n\nWe don't want to cold-email them. If you know anyone there, could you send them a two-line intro? We'd only invite them to see a game at "+shortSchool(f)+" or come to the SCORES Cup as our guests. No ask this year.\n\nA one-page summary is attached in case it helps."+sig;

  if(t.dataset.cell){S.cell=S.cell===t.dataset.cell?null:t.dataset.cell;render();return}if(t.dataset.scen){PLAN.win=SCEN[t.dataset.scen].win.slice();render();return}
  if(t.dataset.step){go(t.dataset.step);return}
  if(t.dataset.go){if(t.dataset.go==="track"&&!personal().some(function(f){return S.appr[f.id]==="a"})){personal().forEach(function(f){if(!S.appr[f.id])S.appr[f.id]="a"});toast("All waiting asks planned so the year can start")}go(t.dataset.go);return}
  if(t.dataset.sel){S.sel=S.sel===t.dataset.sel?null:t.dataset.sel;render();return}
  if(t.dataset.pick){storeText();S.sel=t.dataset.pick;render();return}
  if(t.dataset.lvl){storeText();S.lv[S.sel]=t.dataset.lvl;render();var b=document.querySelector('[data-lvl="'+t.dataset.lvl+'"]');if(b)b.focus();return}
  switch(t.id){
    case "btnScan":runScan();break;
    case "btnApprove":storeText();S.appr[S.sel]="a";toast("Added to this week's plan. A person makes the call or sends the note.");nextInQueue();break;
    case "btnSkip":storeText();S.appr[S.sel]="s";toast("Not this week. It comes back next Monday.");nextInQueue();break;
    case "btnAll":storeText();actList().forEach(function(f){if(S.appr[f.id]!=="s")S.appr[f.id]="a"});toast("All added to this week's plan");render();break;
    case "btnClaude":rewrite();break;
    case "btnDrvReset":S.plan=JSON.parse(JSON.stringify(PLAN0));PLAN=S.plan;render();toast("Drivers reset to the team plan");break;
    case "btnAllRows":S.all=!S.all;render();break;
    case "btnPlay":play(false);break;
    case "btnAllYear":play(true);break;
    case "btnReplay":S.frame=0;render();break;
    case "btnReset":store.del(KEY);S=fresh();S.plan=JSON.parse(JSON.stringify(PLAN0));PLAN=S.plan;render();toast("Started over");break;
  }
});
function storeText(){var ta=$("email");if(!ta||!S.sel||ta.readOnly)return;if(ta.value!==noteFor(FIRM[S.sel]))S.text[S.sel]=ta.value}
function nextInQueue(){var p=actList(),i=p.findIndex(function(f){return f.id===S.sel});var n=p.slice(i+1).concat(p.slice(0,i)).find(function(f){return !S.appr[f.id]});if(n)S.sel=n.id;render()}
document.addEventListener("change",function(e){
  var d=e.target.dataset||{};
  if(d.drvb){PLAN[d.drvb]=e.target.checked;render();return}
  if(!d.drv)return;var v=parseFloat(e.target.value);if(isNaN(v)||v<0)v=0;var k=d.drv,id=e.target.id;
  if(/^a[0-2]$/.test(k))PLAN.asks[+k[1]]=Math.round(v);
  else if(/^w[0-2]$/.test(k))PLAN.win[+k[1]]=Math.min(100,v)/100;
  else if(k==="cupShare")PLAN.cupShare=Math.min(100,v)/100;
  else PLAN[k]=(k==="prospects"||k==="emails"||k==="intros")?Math.round(v):v;
  render();var el=$(id);if(el)el.focus();
});
document.addEventListener("input",function(e){
  if(e.target.dataset&&e.target.dataset.w){S.w[e.target.dataset.w]=+e.target.value;var id=e.target.id;render();var el=$(id);if(el)el.focus()}
});
document.addEventListener("keydown",function(e){
  if(e.target.closest&&e.target.closest("textarea,input"))return;
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.sel){S.sel=S.sel===e.target.dataset.sel?null:e.target.dataset.sel;render();return}
  if(S.step==="drivers")return;
  var i=STEPS.findIndex(function(s){return s.id===S.step});
  if(e.key==="ArrowRight"&&i<STEPS.length-1){if(S.step==="find"&&!S.scanned){runScan();return}go(STEPS[i+1].id)}
  if(e.key==="ArrowLeft"&&i>0)go(STEPS[i-1].id);
});

S=load()||fresh();S.own=S.own||{};S.lv=S.lv||{};
if(!S.plan||!S.plan.asks)S.plan=JSON.parse(JSON.stringify(PLAN0));if(S.plan.emails==null){S.plan.emails=PLAN0.emails;S.plan.prospects=PLAN0.prospects}if(S.plan.intros==null)S.plan.intros=PLAN0.intros;if(S.plan.hiVal==null)S.plan.hiVal=PLAN0.hiVal;PLAN=S.plan;
render();initLive();
})();
</script>

</html>
